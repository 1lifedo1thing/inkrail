name: Build Inkrail MSIX (Microsoft Store)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release containing Inkrail-Windows-x64.zip'
        required: true
        default: 'v0.1.1'
        type: string
      package_version:
        description: 'MSIX Store version (Major.Minor.Build.0)'
        required: true
        default: '1.0.1.0'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    env:
      SOURCE_TAG: ${{ inputs.release_tag }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out Inkrail
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Store profile migration
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $test = Join-Path $env:RUNNER_TEMP 'Test-Inkrail-Migration.exe'
          $launcherSource = Join-Path $env:GITHUB_WORKSPACE 'packaging\msix\StoreLauncher.cs'
          $checksSource = Join-Path $env:GITHUB_WORKSPACE 'packaging\msix\tests\ProfileMigrationChecks.cs'
          & $compiler /nologo /main:ProfileMigrationChecks /reference:System.Windows.Forms.dll "/out:$test" $launcherSource $checksSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $test
          exit $LASTEXITCODE

      - name: Build unsigned MSIX for Microsoft Store
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1

      - name: Check clipboard, Markdown and typewriter sounds in the packaged Windows editor
        shell: pwsh
        timeout-minutes: 3
        run: ./packaging/windows/check-packaged-editor.ps1 -Archive dist-msix/Inkrail-Windows-x64.zip

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: Inkrail-MSIX-${{ inputs.package_version }}-x64
          path: dist-msix/*.msix
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload corrected portable package
        uses: actions/upload-artifact@v4
        with:
          name: Inkrail-Windows-portable-${{ inputs.package_version }}-x64
          path: dist-msix/Inkrail-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
